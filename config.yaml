# ============================================================
# Job Pusher — Indika Amarasinghe Configuration
# ============================================================

search:
  # --- Target job titles to search for ---
  job_titles:
    # --- Core Project & Delivery ---
    - "Project Manager"
    - "Senior Project Manager"
    - "Delivery Manager"
    - "Delivery Lead"
    - "Program Manager"
    - "Programme Manager"
    - "Project Officer"
    - "Senior Project Officer"
    - "Project Coordinator"
    - "PMO Analyst"
    - "PMO Lead"
    - "Portfolio Manager"

    # --- Business & Strategy ---
    - "Business Analyst"
    - "Senior Business Analyst"
    - "Change Manager"
    - "Change Management Consultant"
    - "Operations Manager"
    - "Process Improvement Manager"
    - "Management Consultant"
    - "Strategy Manager"
    - "Strategic Advisor"
    - "Innovation Manager"

    # --- ESG / Sustainability (transferable from Acuity role) ---
    - "ESG Analyst"
    - "ESG Manager"
    - "Sustainability Analyst"
    - "Sustainability Consultant"
    - "Sustainability Manager"
    - "Sustainability Program Manager"
    - "Climate Risk Analyst"
    - "Climate Change Analyst"
    - "Environmental Consultant"
    - "Environmental Advisor"
    - "ESG Reporting Analyst"
    - "Corporate Responsibility Manager"

    # --- Government / Public Sector (regional roles) ---
    - "Project Manager Government"
    - "Government Project Officer"
    - "Policy Officer"
    - "Grants Manager"
    - "Grants Coordinator"
    - "Community Development Manager"
    - "Regional Project Manager"

    # --- Technology & Digital (transferable from AI/automation work) ---
    - "AI Project Manager"
    - "Digital Transformation Manager"
    - "Technology Project Manager"
    - "ICT Project Manager"
    - "Product Owner"
    - "Scrum Master"

    # --- Stakeholder & Client Facing (from Huawei/Acuity) ---
    - "Account Manager"
    - "Client Relationship Manager"
    - "Engagement Manager"
    - "Service Delivery Manager"

    # --- Healthcare / Community (from AWH / Kids Clinic projects) ---
    - "Healthcare Project Manager"
    - "Health Program Manager"

  # --- Key skills for keyword pre-filtering ---
  # Jobs must match at least 2 of these to be sent to Gemini
  keywords:
    # Project Management
    - "project management"
    - "delivery"
    - "stakeholder"
    - "programme"
    - "program"
    - "agile"
    - "scrum"
    - "governance"
    - "risk management"
    - "KPI"
    - "milestone"
    - "project officer"
    # ESG / Sustainability
    - "ESG"
    - "sustainability"
    - "climate"
    - "environmental"
    - "PCAF"
    - "TNFD"
    - "CSRD"
    - "carbon"
    - "net zero"
    # Finance / Billing / Analytics
    - "billing"
    - "finance"
    - "Excel"
    - "dashboard"
    - "reporting"
    - "data analysis"
    - "automation"
    # Business / Operations
    - "business analyst"
    - "operations"
    - "process improvement"
    - "SOP"
    - "change management"
    # AI / Tech
    - "AI"
    - "artificial intelligence"
    - "digital transformation"
    - "automation"

  # --- Job sources ---
  sites:
    - linkedin
    - indeed
    - seek

  # --- Results per site per search query ---
  results_per_site: 30

  # --- Only include jobs posted within this many hours ---
  hours_old: 48

  # --- Include remote/WFH jobs ---
  include_remote: true

matching:
  # --- Minimum AI match score to show in web UI (can be changed in the slider) ---
  default_min_score: 60

  # --- Pre-filter: jobs need at least this many keyword matches before going to Gemini ---
  # Keeps Gemini quota usage low — irrelevant jobs are filtered out cheaply
  keyword_filter_min: 2

  # --- Gemini model ---
  gemini_model: "gemini-2.0-flash"

locations:
  # --- Albury/Wodonga region (76km radius) ---
  albury_region:
    - "Albury NSW"
    - "Wodonga VIC"
    - "Wangaratta VIC"
    - "Benalla VIC"
    - "Corowa NSW"
    - "Yarrawonga VIC"
    - "Beechworth VIC"
    - "Myrtleford VIC"
    - "Chiltern VIC"
    - "Rutherglen VIC"

  # --- Vline corridor (Albury ↔ Melbourne train line) ---
  vline_corridor:
    - "Seymour VIC"
    - "Benalla VIC"
    - "Wangaratta VIC"
    - "Wodonga VIC"

  # --- Melbourne ---
  melbourne:
    - "Melbourne VIC"

  # --- Seek-specific region slugs ---
  seek_regions:
    - "Albury NSW"
    - "Wodonga VIC"
    - "Wangaratta VIC"
    - "Benalla VIC"
    - "Melbourne VIC"

sheets:
  # --- Google Sheets (optional) ---
  # Fill in your spreadsheet ID if you want to sync to Google Sheets
  spreadsheet_id: ""
  raw_jobs_tab: "Raw Jobs"
  matched_jobs_tab: "Matched Jobs"
  credentials_file: "credentials.json"
