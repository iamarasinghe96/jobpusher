name: Daily Job Scraper

on:
  schedule:
    # Runs at 7:00 AM AEST (21:00 UTC previous day)
    - cron: "0 21 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper + push to Sheets
        working-directory: scraper
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SEARCH_TERMS: ${{ secrets.SEARCH_TERMS }}
          LOCATIONS: ${{ secrets.LOCATIONS }}
          RESULTS_PER_SEARCH: "40"
        run: python push_to_sheets.py

      - name: Upload CSV artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-jobs-${{ github.run_id }}
          path: scraper/scraped_jobs.csv
          retention-days: 7
          if-no-files-found: ignore
